<nav class="skyline-nav">
  <div class="nav-container">
    <!-- Brand -->
    <a class="nav-brand" routerLink="/home">
      <div class="brand-icon">
        <i class="ti ti-plane-departure"></i>
      </div>
      <span class="brand-text">SkyLine</span>
    </a>

    <!-- Links -->
    <ul class="nav-links">
      <li>
        <a routerLink="/home" class="nav-link" routerLinkActive="active">Home</a>
      </li>

      <li>
        <a routerLink="/My-Tickets" routerLinkActive="active" class="nav-link">My Tickets</a>
      </li>

      <li>
        <a routerLink="/checkout" routerLinkActive="active" class="nav-link">checkout</a>
      </li>

      <li>
        <a routerLink="/contact" routerLinkActive="active" class="nav-link">Contact</a>
      </li>
    </ul>

    <!-- User -->
    <div class="nav-user dropdown-user">
      <div class="user-trigger">
        <div class="user-avatar">
          <i class="ti ti-user"></i>
        </div>

        <span class="user-name">{{ displayName }}</span>

        <i class="ti ti-chevron-down dropdown-icon"></i>
      </div>

      <div class="user-dropdown-menu">
        <button class="dropdown-item logout-item" (click)="logout()">
          <i class="ti ti-logout"></i>
          Sign Out
        </button>
      </div>
    </div>
  </div>
</nav>
